name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version Tag'
        required: true
        default: 'v0.1.30-master-sm86'
        type: string
      include_ampere_mfg:
        description: 'Embed SM86 0.3.5-5 in OptiScaler.dll (menu controls)'
        required: false
        default: true
        type: boolean
      accept_ampere_mfg_licenses:
        description: 'Accept RTX 20/30 (SM75/SM86) MFG Licenses'
        required: false
        default: false
        type: boolean
      include_dlss_fg:
        description: 'Include DLSS Frame Generation runtime'
        required: false
        default: false
        type: boolean
      accept_nvidia_licenses:
        description: 'Accept NVIDIA Licenses (if Include DLSS FG is checked)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Verify pinned built-in SM86 runtime
      if: ${{ inputs.include_ampere_mfg }}
      shell: powershell
      run: .\get_sm86_runtime.ps1

    - name: Run package_release.ps1
      shell: powershell
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        $params = @{
            Version = $env:PACKAGE_VERSION
        }
        $params["IncludeAmpereMfg"] = ("${{ inputs.include_ampere_mfg }}" -eq "true")
        if ("${{ inputs.accept_ampere_mfg_licenses }}" -eq "true") {
            $params["AcceptAmpereMfgLicenses"] = $true
        }
        if ("${{ inputs.include_dlss_fg }}" -eq "true") {
            $params["IncludeDlssFrameGeneration"] = $true
        }
        if ("${{ inputs.accept_nvidia_licenses }}" -eq "true") {
            $params["AcceptNvidiaLicenses"] = $true
        }

        Write-Host "Executing package_release.ps1 with options:"
        $params.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key): $($_.Value)" }

        & .\package_release.ps1 @params
        if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) {
            exit $LASTEXITCODE
        }

    - name: Upload Release Archive
      uses: actions/upload-artifact@v4
      with:
        name: OptiScaler-Release-Package-${{ inputs.version }}
        path: release/*.zip
        if-no-files-found: error
